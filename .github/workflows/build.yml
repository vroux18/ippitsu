# À chaque envoi sur main : Godot (sans interface) exporte l'APK et la version web.
#   APK (lien fixe)  : https://github.com/vroux18/ippitsu/releases/latest/download/Ippitsu.apk
#   Web (Pages)      : https://vroux18.github.io/ippitsu/
name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot + modèles d'export
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          mkdir -p ~/godot-bin ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd /tmp
          wget -q $base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/

      - name: Réglages Android (SDK + clé de test fixe)
        run: |
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          mkdir -p ~/.config/godot
          minor=${GODOT_VERSION%.*}
          cat > ~/.config/godot/editor_settings-$minor.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          export/android/debug_keystore = "$GITHUB_WORKSPACE/tools/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF
          cp ~/.config/godot/editor_settings-$minor.tres ~/.config/godot/editor_settings-4.tres
          # numéro de version croissant : l'APK s'installe par-dessus le précédent
          sed -i -E "s/^version\/code=.*/version\/code=${{ github.run_number }}/; s/^version\/name=.*/version\/name=\"0.1.${{ github.run_number }}\"/" export_presets.cfg
          # même numéro dans le jeu (affiché en bas de l'accueil)
          sed -i -E 's/^config\/name="Ippitsu"/config\/name="Ippitsu"\nconfig\/version="0.1.${{ github.run_number }}"/' project.godot

      - name: Musique (fabriquée une fois, en OGG)
        run: |
          godot --headless --path . --script tools/bake_music.gd
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in assets/music/*.wav; do ffmpeg -loglevel error -y -i "$f" -ac 1 -c:a libvorbis -q:a 2 "${f%.wav}.ogg"; rm "$f"; done
          ls -la assets/music
          du -ch assets/music/*.ogg | tail -1

      - name: Import du projet
        run: godot --headless --path . --import || true

      - name: Vérification des scripts (quelques secondes de jeu)
        run: |
          godot --headless --path . --quit-after 180 2>&1 | tee run.log
          godot --headless --path . --quit-after 900 -- --autoplay 2>&1 | tee -a run.log
          ! grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" run.log

      - name: Export APK
        # build release (arm64 seul), signé avec la MÊME clé fixe que les builds debug précédents :
        # même signature, l'APK continue de s'installer par-dessus la version déjà installée
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: android
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ github.workspace }}/tools/debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        run: |
          mkdir -p build
          godot --headless --path . --export-release "Android" build/Ippitsu.apk
          test -s build/Ippitsu.apk
          ls -la build/Ippitsu.apk

      - name: Export web
        run: |
          mkdir -p build/web
          # noms de fichiers uniques à chaque build : pas de mélange de versions dans le cache du téléphone
          # (passer en --export-debug pour voir les erreurs de script dans la console du navigateur)
          godot --headless --path . --export-release "Web" build/web/ippitsu-${{ github.run_number }}.html
          cp build/web/ippitsu-${{ github.run_number }}.html build/web/index.html
          test -s build/web/index.html

      - name: Publication (release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test-${{ github.run_number }}
          name: Ippitsu — test ${{ github.run_number }}
          body: "Version de test générée automatiquement depuis ${{ github.sha }}."
          files: build/Ippitsu.apk
          make_latest: true

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  # robot testeur : joue les 5 mondes en entier (en parallèle de l'export, ne bloque pas l'APK)
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot-bin
          cd /tmp
          wget -q https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot

      - name: Musique et import
        run: |
          echo "$HOME/godot-bin" >> $GITHUB_PATH
          export PATH="$HOME/godot-bin:$PATH"
          godot --headless --path . --script tools/bake_music.gd
          which ffmpeg || (sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg)
          for f in assets/music/*.wav; do ffmpeg -loglevel error -y -i "$f" -ac 1 -c:a libvorbis -q:a 2 "${f%.wav}.ogg"; rm "$f"; done
          godot --headless --path . --import || true

      - name: Partie complète des 5 mondes
        run: |
          timeout 1200 godot --headless --path . --fixed-fps 30 -- --bot > bot.log 2>&1 || true
          grep -E "^BOT|SCRIPT ERROR|Invalid call|Invalid access" bot.log | head -400
          # (sous bash -e, « ! cmd » ne fait pas échouer l'étape : on teste explicitement)
          fail=0
          grep -q "BOT DONE" bot.log || { echo "::error::le robot n'a pas fini"; fail=1; }
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Invalid call|Invalid access" bot.log; then fail=1; fi
          # erreurs du moteur pendant la partie (hors fuites signalées à la fermeture)
          errs=$(grep -E "^ERROR:" bot.log | grep -v "at exit" || true)
          if [ -n "$errs" ]; then echo "$errs" | sort | uniq -c; fail=1; fi
          # salles où le robot est resté bloqué
          if grep "^BOT ALERTE" bot.log; then fail=1; fi
          exit $fail

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bot-log
          path: bot.log

  web:
    needs: export
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
