<script type="text/x-dc" data-dc-script data-props='{"hpFull":{"editor":"int","default":3,"min":0,"max":5},"mult":{"editor":"enum","options":["×1,5","×2","×3","×4"],"default":"×2"},"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const full = this.props.hpFull ?? 3;
    const C = [['8,178.0 24,174.5 24,152.4 8,155.9',178.0,152.4],['8,148.4 24,144.9 24,122.8 8,126.3',148.4,122.8],['8,118.8 24,115.3 24,93.2 8,96.7',118.8,93.2],['8,89.2 24,85.7 24,63.6 8,67.1',89.2,63.6],['8,59.6 24,56.1 24,34.0 8,37.5',59.6,34.0]];
    const hp = C.map((c, i) => i < full
      ? { pts: c[0], fill: '#D7372B', fo: 1, so: 0, dash: 'none', hl: 'M10.5 ' + (c[1]-3) + ' V ' + (c[2]+5.5) }
      : i === full
        ? { pts: c[0], fill: '#EFE6D2', fo: 0.55, so: 0, dash: 'none', hl: '' }
        : { pts: c[0], fill: '#EFE6D2', fo: 0.12, so: 0, dash: 'none', hl: '' });
    const m = this.props.mult ?? '×2';
    const colors = { '×1,5': '#3E9C8C', '×2': '#E2A93B', '×3': '#E25A3F', '×4': '#C2668F' };
    return { hp, multLabel: m, multColor: colors[m] || '#E2A93B' };
  }
}
</script>
