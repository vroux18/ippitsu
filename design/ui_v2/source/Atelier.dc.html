<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Atelier</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D7372B}a:hover{color:#1B1A1E}
.sh{font-family:'Shippori Mincho',serif;font-weight:800}
.cnt{height:34px;box-sizing:border-box;padding:0 12px 0 5px;border-radius:17px;background:#1B1A1E;color:#EFE6D2;display:flex;align-items:center;gap:6px}
</style>
</helmet>
<div style="width: 400px; height: 860px; position: relative; overflow: hidden; background: #EFE6D2; font-family: 'Zen Kaku Gothic New', sans-serif; color: #1B1A1E">
<svg width="400" height="860" viewBox="0 0 400 860" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<defs><pattern id="asa" width="28" height="24" patternUnits="userSpaceOnUse"><path d="M14 0 L14 24 M0 6 L28 18 M0 18 L28 6 M14 12 L0 0 M14 12 L28 0 M14 12 L0 24 M14 12 L28 24" fill="none" stroke="#6E5A44" stroke-width="0.8" stroke-opacity="0.16"></path></pattern></defs>
<rect width="400" height="860" fill="url(#asa)"></rect>
</svg>

<a href="Accueil.dc.html" aria-label="Accueil" style="position: absolute; left: 14px; top: 36px; width: 44px; height: 44px; border-radius: 22px; background: #1B1A1E; display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 L16 5 L27 15 M8 13 V27 H24 V13 M14 27 V20 H18 V27" fill="none" stroke="#EFE6D2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</a>
<div style="position: absolute; left: 0; right: 0; top: 38px; display: flex; flex-direction: column; align-items: center">
<div style="display: flex; align-items: center; gap: 8px"><h1 class="sh" style="margin: 0; font-size: 22px; letter-spacing: 5px">ATELIER</h1></div>
<svg width="140" height="8" viewBox="0 0 200 10" aria-hidden="true"><path d="M4 6 C 60 1, 140 2, 196 5 L 190 8 C 130 9, 60 9, 8 8 Z" fill="#D7372B"></path></svg>
</div>

<div style="position: absolute; right: 14px; top: 92px; display: flex; gap: 6px">
<div class="cnt"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="15" fill="#1F3A5F"></circle><path d="M16 6 C20 12 23 15 23 19 A7 7 0 0 1 9 19 C9 15 12 12 16 6 Z" fill="#EFE6D2"></path></svg><b class="sh" style="font-size: 15px">112</b></div>
<div class="cnt"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="5" fill="#D7372B"></rect><path d="M9 9 H23 V23 H9 Z M16 9 V23" fill="none" stroke="#EFE6D2" stroke-width="2.2"></path></svg><b class="sh" style="font-size: 15px">0</b></div>
<div class="cnt"><svg width="24" height="24" viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="2" width="28" height="28" rx="5" fill="#C49A45"></rect><path d="M7 9 H25 V23 H7 Z M9 21 L14 15 L17 19 L20 16 L24 21" fill="none" stroke="#1B1A1E" stroke-width="1.8" stroke-linejoin="round"></path></svg><b class="sh" style="font-size: 15px">2<span style="font-size: 11px; opacity: 0.6">/24</span></b></div>
</div>

<div style="position: absolute; left: 14px; top: 132px"><div role="tablist" style="position: relative; width: 372px; height: 58px; display: flex"><button role="tab" aria-selected="true" style="position: relative; flex: 1 1 0; height: 50px; background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #F5EEDD"><svg width="100%" height="44" viewBox="0 0 100 40" preserveAspectRatio="none" style="position: absolute; left: 0; top: 4px" aria-hidden="true"><path d="M4 12 C 30 4, 70 5, 97 9 L 92 22 L 98 33 C 66 39, 32 39, 2 35 L 8 23 Z" fill="#1B1A1E"></path></svg><span class="sh" style="position: relative; font-size: 11.5px; letter-spacing: 2px">AMÉLIORER</span></button><button role="tab" aria-selected="false" style="position: relative; flex: 1 1 0; height: 50px; background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #5A5148"><span class="sh" style="position: relative; font-size: 11.5px; letter-spacing: 2px">SCEAUX</span></button><button role="tab" aria-selected="false" style="position: relative; flex: 1 1 0; height: 50px; background: none; border: none; padding: 0; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: #5A5148"><span class="sh" style="position: relative; font-size: 11.5px; letter-spacing: 2px">ESTAMPES</span><span style="position: absolute; right: 10px; top: 8px; width: 7px; height: 7px; border-radius: 4px; background: #D7372B"></span></button></div></div>

<div style="position: absolute; left: 14px; right: 14px; top: 200px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{ups}}" as="u" hint-placeholder-count="6">
<div style="{{u.box}}">
<svg width="54" height="54" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="27" fill="{{u.c}}" stroke="#1B1A1E" stroke-width="2.5"></circle><path d="{{u.d}}" fill="{{u.f}}" stroke="#EFE6D2" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<b class="sh" style="font-size: 16px; line-height: 1">{{u.name}}</b>
<div style="display: flex; gap: 3px"><sc-for list="{{u.crans}}" as="c" hint-placeholder-count="5"><span style="{{c}}"></span></sc-for></div>
<div style="display: flex; align-items: center; gap: 5px"><svg width="14" height="14" viewBox="0 0 32 32" aria-hidden="true"><path d="{{u.sd}}" fill="none" stroke="#5A5148" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg><span class="sh" style="font-size: 14px; color: #8C8273">{{u.from}}</span><svg width="12" height="12" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16 H24 M18 10 L25 16 L18 22" fill="none" stroke="#8C8273" stroke-width="3" stroke-linecap="round"></path></svg><span class="sh" style="font-size: 14px; color: #2E7D4F">{{u.to}}</span></div>
<button style="{{u.btn}}"><sc-if value="{{u.armed}}" hint-placeholder-val="{{false}}"><svg width="16" height="16" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16 L13 23 L26 9" fill="none" stroke="#EFE6D2" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></sc-if><svg width="14" height="14" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 C22 12 26 16 26 21 A10 10 0 0 1 6 21 C6 16 10 12 16 3 Z" fill="{{u.dropC}}"></path></svg><span class="sh" style="font-size: 15px">{{u.price}}</span></button>
</div>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const raw = [
      ['Pinceau long', '#2F5D8A', 'none', 'M16 44 L40 20 M36 16 L44 24 M16 44 L12 48', 5, 1, '+1 m', '+2 m', 'M4 16 H26 M20 10 L27 16 L20 22', 30, 'normal'],
      ['Encre vive', '#3A3846', '#EFE6D2', 'M30 14 C36 22 40 26 40 32 A10 10 0 0 1 20 32 C20 26 24 22 30 14 Z', 5, 0, '+0 %', '+6 %', 'M25 12 A10 10 0 1 0 26 18 M25 5 V12 H18', 30, 'armed'],
      ['Peau de papier', '#D7372B', '#EFE6D2', 'M30 44 C 18 35, 14 29, 18 23 C 21 18, 27 19, 30 24 C 33 19, 39 18, 42 23 C 46 29, 42 35, 30 44 Z', 3, 0, '+0', '+1', 'M16 27 C 6 19, 3 14, 6 9 C 9 5, 14 6, 16 10 C 18 6, 23 5, 26 9 C 29 14, 26 19, 16 27 Z', 80, 'normal'],
      ['Second souffle', '#3E9C8C', 'none', 'M18 40 L18 24 A12 12 0 0 1 42 24 L42 40 M24 20 L30 14 L36 20', 2, 0, '1', '2', 'M16 26 V10 M10 16 L16 10 L22 16 M8 28 H24', 200, 'poor'],
      ['Bourse', '#C49A45', 'none', 'M20 22 H40 L44 44 H16 Z M24 22 L22 14 H38 L36 22 M30 30 a3 3 0 1 0 0.1 0', 5, 0, '+0 %', '+5 %', 'M16 3 C22 12 26 16 26 21 A10 10 0 0 1 6 21 C6 16 10 12 16 3 Z', 25, 'normal'],
      ['Choix', '#8A5BB0', 'none', 'M40 24 A12 12 0 1 0 41 34 M40 16 V24 H32', 3, 3, '+3', 'max', 'M25 12 A10 10 0 1 0 26 18 M25 5 V12 H18', 0, 'max']
    ];
    const ups = raw.map((r) => {
      const max = r[4], lvl = r[5], state = r[10];
      const crans = Array.from({ length: max }, (_, i) => 'width: ' + (max > 3 ? 22 : 34) + 'px; height: 6px; border-radius: 3px; box-sizing: border-box; ' + (i < lvl ? 'background: #C49A45' : 'border: 1.5px solid #CFC4AE'));
      let btn = "width: 100%; height: 36px; border-radius: 18px; display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer; font-family: 'Shippori Mincho', serif; font-weight: 800; ";
      let dropC = '#EFE6D2';
      if (state === 'armed') btn += 'background: #1B1A1E; color: #EFE6D2; border: 2px solid #D7372B; box-shadow: 0 0 0 3px rgba(215,55,43,0.35)';
      else if (state === 'poor') { btn += 'background: #E4D9C2; color: #A99E8B; border: none'; dropC = '#A99E8B'; }
      else if (state === 'max') { btn += 'background: transparent; color: #9A6B12; border: 2px solid #C49A45'; dropC = 'transparent'; }
      else btn += 'background: #D7372B; color: #EFE6D2; border: none; box-shadow: 0 3px 0 #8E1F17';
      return {
        name: r[0], c: r[1], f: r[2], d: r[3], crans, from: r[6], to: r[7], sd: r[8],
        price: state === 'max' ? 'MAX' : String(r[9]), armed: state === 'armed', dropC, btn,
        box: 'height: 200px; border-radius: 14px; background: #F5EEDD; box-sizing: border-box; padding: 10px 12px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; border: ' + (state === 'armed' ? '2px solid #D7372B' : '1.5px solid #CFC4AE')
      };
    });
    return { ups };
  }
}
</script>
</body>
</html>
