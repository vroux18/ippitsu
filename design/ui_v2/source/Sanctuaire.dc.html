<!doctype html>
<html lang="fr">
<head>

<rect x="70" y="150" width="260" height="14" rx="3"></rect>
<rect x="88" y="178" width="224" height="9"></rect>
<rect x="112" y="150" width="14" height="300"></rect>
<rect x="274" y="150" width="14" height="300"></rect>
</g>
<path d="M0 760 q50 -18 100 0 q50 -18 100 0 q50 -18 100 0 q50 -18 100 0 M0 800 q50 -18 100 0 q50 -18 100 0 q50 -18 100 0 q50 -18 100 0" fill="none" stroke="#D7372B" stroke-opacity="0.3" stroke-width="2"></path>
</svg>

<div style="position: absolute; left: 0; right: 0; top: 52px; display: flex; flex-direction: column; align-items: center; gap: 2px">
<div style="display: flex; align-items: center; gap: 10px">
<h1 class="sh" style="margin: 0; font-size: 26px; letter-spacing: 8px">PACTE</h1>

</div>
<svg width="160" height="10" viewBox="0 0 200 10" aria-hidden="true"><path d="M4 6 C 60 1, 140 2, 196 5 L 190 8 C 130 9, 60 9, 8 8 Z" fill="#D7372B"></path></svg>
</div>

<div style="position: absolute; left: 47px; top: 230px; display: flex; gap: 16px">
<div style="width: 145px; height: 312px"><div style="width: 116px; height: 250px; transform: scale(1.25); transform-origin: top left"><dc-import name="RouleauCard" item="{{p1}}" hint-size="116px,250px"></dc-import></div></div>
<div style="width: 145px; height: 312px"><div style="width: 116px; height: 250px; transform: scale(1.25); transform-origin: top left"><dc-import name="RouleauCard" item="{{p2}}" hint-size="116px,250px"></dc-import></div></div>
</div>


<div style="position: absolute; left: 0; right: 0; top: 640px; display: flex; flex-direction: column; align-items: center; gap: 16px">
<button style="position: relative; width: 230px; height: 66px; background: none; border: none; padding: 0; cursor: pointer; color: #EFE6D2">

<svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M8 8 L24 24 M24 8 L8 24" fill="none" stroke="#EFE6D2" stroke-width="3" stroke-linecap="round"></path></svg>
<span class="sh" style="font-size: 15px; letter-spacing: 4px">REFUSER</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>

    return {
      p1: { name: 'Déferlante', el: 'eau', rarity: 'pacte', dark: true, noHarm: true, glyph: 'vague', trig: 'permanent', lvlFrom: 2, effects: [{ ico: 'vague', val: 'vagues', lab: 'en combat', neg: true }, { ico: 'rouleau', val: '+2', lab: 'rouleaux' }] },

    };
  }
}
</script>
