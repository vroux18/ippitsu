<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Comment jouer, les figures</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@800&amp;family=Zen+Kaku+Gothic+New:wght@500;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#D7372B}a:hover{color:#1B1A1E}
.sh{font-family:'Shippori Mincho',serif;font-weight:800}
</style>
</helmet>
<div style="width: 400px; height: 860px; position: relative; overflow: hidden; background: #1B1A1E; font-family: 'Zen Kaku Gothic New', sans-serif; color: #1B1A1E">
<button aria-label="Passer" style="position: absolute; right: 14px; top: 36px; width: 44px; height: 44px; border-radius: 22px; background: transparent; border: 1.5px solid rgba(239,230,210,0.55); display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 8 L14 16 L6 24 M15 8 L23 16 L15 24 M26 8 V24" fill="none" stroke="#EFE6D2" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>

<div style="position: absolute; left: 24px; right: 24px; top: 104px; height: 600px; border-radius: 18px; background: #EFE6D2; overflow: hidden">
<div style="position: absolute; left: 0; right: 0; top: 26px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<div style="display: flex; align-items: center; gap: 8px"><h1 class="sh" style="margin: 0; font-size: 24px; letter-spacing: 5px">LES FIGURES</h1></div>
<span style="font-weight: 700; font-size: 13px; color: #5A5148">Une forme dans le trait frappe plus fort.</span>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 104px; height: 220px; border-radius: 14px; background: #E8CC97; overflow: hidden">
<svg width="312" height="220" viewBox="0 0 312 220" style="position: absolute; left: 0; top: 0" aria-hidden="true">
<path d="M40 190 C 40 110, 170 70, 156 130 C 142 190, 60 140, 110 100 C 150 70, 200 90, 230 50" fill="none" stroke="#1B1A1E" stroke-opacity="0.25" stroke-width="10" stroke-linecap="round"></path>
<path d="M40 190 C 40 110, 170 70, 156 130 C 142 190, 60 140, 110 100" fill="none" stroke="#3E9C8C" stroke-width="7" stroke-linecap="round"></path>
<circle cx="110" cy="100" r="13" fill="#232838" stroke="#1B1A1E" stroke-width="2"></circle>
<rect x="98" y="94" width="24" height="4" fill="#D7372B"></rect>
<g><circle cx="250" cy="60" r="14" fill="#3E7A57" stroke="#1B1A1E" stroke-width="2.5"></circle><polygon points="241,49 237,36 246,46" fill="#EFE6D2"></polygon><polygon points="259,49 263,36 254,46" fill="#EFE6D2"></polygon></g>
<g fill="#3E9C8C"><circle cx="150" cy="104" r="4"></circle><circle cx="160" cy="92" r="2.5"></circle><circle cx="140" cy="116" r="2.5"></circle></g>
</svg>
<div style="position: absolute; right: 12px; bottom: 12px; height: 32px; padding: 0 12px; border-radius: 16px; background: #1B1A1E; color: #EFE6D2; display: flex; align-items: center; gap: 6px; border: 2px solid #3E9C8C">
<svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 26 C 5 12, 24 6, 22 17 C 20 27, 7 20, 15 12 C 21 7, 27 12, 28 5" fill="none" stroke="#3E9C8C" stroke-width="3.2" stroke-linecap="round"></path></svg><b class="sh" style="font-size: 13px">Boucle</b></div>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 344px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
<sc-for list="{{figs}}" as="f" hint-placeholder-count="6">
<div style="{{f.box}}"><svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true"><path d="{{f.d}}" fill="none" stroke="{{f.c}}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"></path></svg><b class="sh" style="font-size: 11px">{{f.n}}</b></div>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 0; right: 0; top: 730px; display: flex; justify-content: center; gap: 8px" aria-label="Planche 3 sur 6">
<span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(239,230,210,0.5)"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(239,230,210,0.5)"></span>
<span style="width: 22px; height: 7px; border-radius: 4px; background: #D7372B"></span>
<span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(239,230,210,0.2)"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(239,230,210,0.2)"></span><span style="width: 7px; height: 7px; border-radius: 4px; background: rgba(239,230,210,0.2)"></span>
</div>
<button aria-label="Suivant" style="position: absolute; left: 50%; top: 760px; transform: translateX(-50%); width: 64px; height: 64px; border-radius: 32px; background: #EFE6D2; border: 3px solid #D7372B; display: flex; align-items: center; justify-content: center; padding: 0; cursor: pointer">
<svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true"><path d="M6 16 H24 M17 9 L25 16 L17 23" fill="none" stroke="#1B1A1E" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
</button>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":860}}'>
class Component extends DCLogic {
  renderVals() {
    const F = [
      ['Boucle', '#3E9C8C', 'M5 26 C 5 12, 24 6, 22 17 C 20 27, 7 20, 15 12 C 21 7, 27 12, 28 5', true],
      ['Zigzag', '#D9A93A', 'M4 24 L11 8 L17 24 L23 8 L28 22'],
      ['Trait droit', '#C8463A', 'M5 27 L27 5'],
      ['Aller-retour', '#3D7EC4', 'M5 12 L27 12 M23 8 L27 12 L23 16 M27 20 L5 20 M9 16 L5 20 L9 24'],
      ['Enso', '#C2668F', 'M24 7 A11 11 0 1 0 27 14'],
      ['Crochet', '#8A5BB0', 'M5 8 L23 8 Q27 8 26 12 L19 27']
    ];
    const figs = F.map((f) => ({ n: f[0], c: f[1], d: f[2], box: 'height: 104px; border-radius: 12px; background: #F5EEDD; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; box-sizing: border-box; ' + (f[3] ? 'border: 3px solid ' + f[1] : 'border: 1.5px solid #CFC4AE') }));
    return { figs };
  }
}
</script>
</body>
</html>
